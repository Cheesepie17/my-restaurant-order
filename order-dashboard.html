<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>หน้าจอห้องครัว & พนักงาน - Live Orders Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --pending: #f59e0b;
      --pending-bg: rgba(245, 158, 11, 0.15);
      --preparing: #3b82f6;
      --preparing-bg: rgba(59, 130, 246, 0.15);
      --served: #10b981;
      --served-bg: rgba(16, 185, 129, 0.15);
      --cancelled: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .title-area h1 {
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 9999px;
      font-weight: 500;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #34d399;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .controls-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .filter-btn {
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: #3b82f6;
      color: white;
      border-color: #3b82f6;
    }

    .sound-toggle-btn {
      background: #334155;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Stats Overview */
    .table-status-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    @media (max-width: 768px) {
      .table-status-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .table-quick-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .table-name {
      font-size: 15px;
      font-weight: 700;
    }

    .table-active-count {
      font-size: 12px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
    }

    /* Orders Grid */
    .orders-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .order-card {
      background: var(--card-bg);
      border-radius: 14px;
      border: 2px solid var(--border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s, border-color 0.2s;
    }

    .order-card.status-pending {
      border-color: var(--pending);
    }

    .order-card.status-preparing {
      border-color: var(--preparing);
    }

    .order-card.status-served {
      border-color: #334155;
      opacity: 0.75;
    }

    .order-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .table-badge-large {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }

    .order-meta {
      font-size: 12px;
      color: var(--text-muted);
    }

    .status-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 9999px;
    }

    .status-pending .status-badge {
      background: var(--pending-bg);
      color: var(--pending);
    }

    .status-preparing .status-badge {
      background: var(--preparing-bg);
      color: var(--preparing);
    }

    .status-served .status-badge {
      background: var(--served-bg);
      color: var(--served);
    }

    .items-list {
      flex: 1;
      margin-bottom: 14px;
    }

    .order-item-row {
      display: flex;
      flex-direction: column;
      padding: 6px 0;
      border-bottom: 1px dashed rgba(255,255,255,0.08);
    }

    .order-item-row:last-child {
      border-bottom: none;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
    }

    .item-title {
      font-weight: 600;
    }

    .item-qty {
      font-weight: 700;
      color: #38bdf8;
    }

    .item-special {
      font-size: 12px;
      color: #f87171;
      background: rgba(248, 113, 113, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      margin-top: 3px;
      display: inline-block;
    }

    .order-note-box {
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      color: #fde047;
      margin-bottom: 12px;
    }

    .order-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      margin-top: auto;
    }

    .order-total-price {
      font-size: 16px;
      font-weight: 700;
      color: #f8fafc;
    }

    .action-btn-group {
      display: flex;
      gap: 6px;
    }

    .action-btn {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .action-btn:hover {
      opacity: 0.9;
    }

    .btn-start {
      background: #3b82f6;
      color: white;
    }

    .btn-done {
      background: #10b981;
      color: white;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="title-area">
      <h1>
        👨‍🍳 ครัว & รายการออเดอร์
        <span class="live-badge">
          <span class="pulse-dot"></span>
          Live Sync (3s)
        </span>
      </h1>
    </div>

    <div class="controls-area">
      <button id="filterActive" class="filter-btn active" onclick="setFilter('active')">
        🔥 กำลังดำเนินการ (<span id="activeCount">0</span>)
      </button>
      <button id="filterAll" class="filter-btn" onclick="setFilter('all')">
        📋 ทั้งหมด (<span id="allCount">0</span>)
      </button>
      <button id="soundBtn" class="sound-toggle-btn" onclick="toggleSound()">
        🔔 เสียงแจ้งเตือน: เปิด
      </button>
    </div>
  </div>

  <!-- สถานะ 4 โต๊ะ -->
  <div class="table-status-grid">
    <div class="table-quick-card" id="tableCard-1">
      <span class="table-name">โต๊ะ 1</span>
      <span class="table-active-count" style="background:#334155; color:#94a3b8;">ว่าง</span>
    </div>
    <div class="table-quick-card" id="tableCard-2">
      <span class="table-name">โต๊ะ 2</span>
      <span class="table-active-count" style="background:#334155; color:#94a3b8;">ว่าง</span>
    </div>
    <div class="table-quick-card" id="tableCard-3">
      <span class="table-name">โต๊ะ 3</span>
      <span class="table-active-count" style="background:#334155; color:#94a3b8;">ว่าง</span>
    </div>
    <div class="table-quick-card" id="tableCard-4">
      <span class="table-name">โต๊ะ 4</span>
      <span class="table-active-count" style="background:#334155; color:#94a3b8;">ว่าง</span>
    </div>
  </div>

  <!-- รายการออเดอร์ -->
  <div id="ordersContainer" class="orders-container">
    <div class="empty-state">
      <h3>⏳ กำลังโหลดรายการออเดอร์...</h3>
    </div>
  </div>

  <script>
    let ordersList = [];
    let knownOrderIds = new Set();
    let currentFilter = 'active'; // 'active' หรือ 'all'
    let soundEnabled = true;
    let audioCtx = null;

    // Web Audio API Chime Synthesizer
    function playOrderChime() {
      if (!soundEnabled) return;

      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        // เล่นเสียงแจ้งเตือนแบบกระดิ่งสองโน้ต (G5 -> C6)
        const notes = [784, 1046.5];
        notes.forEach((freq, index) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.15);

          gain.gain.setValueAtTime(0.3, audioCtx.currentTime + index * 0.15);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + index * 0.15 + 0.4);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(audioCtx.currentTime + index * 0.15);
          osc.stop(audioCtx.currentTime + index * 0.15 + 0.4);
        });

        // สั่งสั่นอุปกรณ์ (ถ้ารองรับ เช่น มือถือแอนดรอยด์ของพนักงาน)
        if (navigator.vibrate) {
          navigator.vibrate([200, 100, 200]);
        }
      } catch (err) {
        console.warn('Audio chime warning:', err);
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('soundBtn');
      btn.textContent = soundEnabled ? '🔔 เสียงแจ้งเตือน: เปิด' : '🔕 เสียงแจ้งเตือน: ปิด';
      btn.style.background = soundEnabled ? '#334155' : '#7f1d1d';
      
      // Init audio context on user interaction
      if (soundEnabled && !audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.getElementById('filterActive').classList.toggle('active', filter === 'active');
      document.getElementById('filterAll').classList.toggle('active', filter === 'all');
      renderOrders();
    }

    async function fetchOrders(isFirstLoad = false) {
      try {
        const res = await fetch('/api/orders');
        const json = await res.json();

        if (json.success && Array.isArray(json.data)) {
          const freshOrders = json.data;

          // ตรวจสอบว่ามีออเดอร์ใหม่ที่ไม่เคยพบมาก่อนหรือไม่
          let hasNewOrders = false;
          freshOrders.forEach(order => {
            if (!knownOrderIds.has(order.id)) {
              knownOrderIds.add(order.id);
              if (!isFirstLoad && order.status !== 'served' && order.status !== 'cancelled') {
                hasNewOrders = true;
              }
            }
          });

          if (hasNewOrders) {
            playOrderChime();
          }

          ordersList = freshOrders;
          updateTableSummaries();
          renderOrders();
        }
      } catch (err) {
        console.error('Fetch orders polling error:', err);
      }
    }

    function updateTableSummaries() {
      // นับจำนวนออเดอร์ Active ของแต่ละโต๊ะ (1-4)
      const tableCounts = { 1: 0, 2: 0, 3: 0, 4: 0 };
      let activeTotal = 0;

      ordersList.forEach(order => {
        if (order.status === 'pending' || order.status === 'preparing') {
          activeTotal++;
          if (tableCounts[order.table_no] !== undefined) {
            tableCounts[order.table_no]++;
          }
        }
      });

      document.getElementById('activeCount').textContent = activeTotal;
      document.getElementById('allCount').textContent = ordersList.length;

      for (let t = 1; t <= 4; t++) {
        const card = document.getElementById(`tableCard-${t}`);
        const countSpan = card.querySelector('.table-active-count');
        const count = tableCounts[t];

        if (count > 0) {
          countSpan.textContent = `${count} ออเดอร์`;
          countSpan.style.background = 'rgba(239, 68, 68, 0.2)';
          countSpan.style.color = '#f87171';
        } else {
          countSpan.textContent = 'ว่าง';
          countSpan.style.background = '#334155';
          countSpan.style.color = '#94a3b8';
        }
      }
    }

    function renderOrders() {
      const container = document.getElementById('ordersContainer');
      
      const filtered = ordersList.filter(order => {
        if (currentFilter === 'active') {
          return order.status === 'pending' || order.status === 'preparing';
        }
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3 style="font-size: 18px; margin-bottom: 6px;">🎉 ไม่มีออเดอร์ค้างในขณะนี้</h3>
            <p>เมื่อลูกค้าสั่งอาหาร ออเดอร์จะแสดงและส่งเสียงเตือนขึ้นที่นี่ทันที</p>
          </div>
        `;
        return;
      }

      container.innerHTML = '';

      filtered.forEach(order => {
        const card = document.createElement('div');
        card.className = `order-card status-${order.status}`;

        let statusText = 'รอรับออเดอร์';
        if (order.status === 'preparing') statusText = '👨‍🍳 กำลังปรุง';
        if (order.status === 'served') statusText = '✅ เสิร์ฟแล้ว';
        if (order.status === 'cancelled') statusText = '❌ ยกเลิก';

        const timeStr = new Date(order.created_at).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        const itemsHtml = order.items.map(item => {
          let optionTags = '';
          if (item.special_request) {
            const parts = item.special_request.split('|').map(p => p.trim()).filter(Boolean);
            optionTags = parts.map(part => {
              if (part.startsWith('เนื้อ:')) {
                return `<span class="item-special" style="background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4);">🥩 ${part}</span>`;
              } else if (part.startsWith('เพิ่ม:')) {
                return `<span class="item-special" style="background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4);">🍳 ${part}</span>`;
              } else if (part.includes('เผ็ด')) {
                return `<span class="item-special" style="background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4);">🌶️ ${part}</span>`;
              }
              return `<span class="item-special">${part}</span>`;
            }).join(' ');
          }

          return `
            <div class="order-item-row">
              <div class="item-header">
                <span class="item-title">${item.item_name}</span>
                <span class="item-qty">x${item.quantity}</span>
              </div>
              ${optionTags ? `<div style="display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px;">${optionTags}</div>` : ''}
            </div>
          `;
        }).join('');


        let actionBtns = '';
        if (order.status === 'pending') {
          actionBtns = `
            <button class="action-btn btn-start" onclick="updateOrderStatus(${order.id}, 'preparing')">
              🍳 รับทำออเดอร์
            </button>
          `;
        } else if (order.status === 'preparing') {
          actionBtns = `
            <button class="action-btn btn-done" onclick="updateOrderStatus(${order.id}, 'served')">
              ✅ เสิร์ฟแล้ว
            </button>
          `;
        }

        card.innerHTML = `
          <div class="order-card-header">
            <div>
              <div class="table-badge-large">โต๊ะ ${order.table_no}</div>
              <div class="order-meta">#${order.id} • ${timeStr}</div>
            </div>
            <span class="status-badge">${statusText}</span>
          </div>

          <div class="items-list">
            ${itemsHtml}
          </div>

          ${order.customer_note ? `<div class="order-note-box">📝 หมายเหตุ: ${order.customer_note}</div>` : ''}

          <div class="order-footer">
            <div class="order-total-price">฿${order.total_price}</div>
            <div class="action-btn-group">
              ${actionBtns}
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    async function updateOrderStatus(orderId, newStatus) {
      try {
        const res = await fetch(`/api/orders/${orderId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus })
        });

        const json = await res.json();
        if (json.success) {
          fetchOrders();
        } else {
          alert('ไม่สามารถอัปเดตสถานะได้: ' + json.error);
        }
      } catch (err) {
        console.error('Update status error:', err);
      }
    }

    // เริ่มต้นทำงาน และตั้ง Polling ทุก 3 วินาที
    window.addEventListener('DOMContentLoaded', () => {
      fetchOrders(true);
      setInterval(() => {
        fetchOrders(false);
      }, 3000);
    });
  </script>
</body>
</html>
